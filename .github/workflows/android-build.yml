name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_KEYSTORE_PASSWORD: ${{ secrets.GEMINI_KEYSTORE_PASSWORD }}
      GEMINI_KEY_ALIAS: ${{ secrets.GEMINI_KEY_ALIAS }}
      GEMINI_KEY_PASSWORD: ${{ secrets.GEMINI_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve signing defaults
        run: |
          echo "GEMINI_KEYSTORE_PASSWORD=${GEMINI_KEYSTORE_PASSWORD:-changeit123}" >> "$GITHUB_ENV"
          echo "GEMINI_KEY_ALIAS=${GEMINI_KEY_ALIAS:-gemini_mobile}" >> "$GITHUB_ENV"
          echo "GEMINI_KEY_PASSWORD=${GEMINI_KEY_PASSWORD:-changeit123}" >> "$GITHUB_ENV"

      - name: Generate release keystore
        run: |
          mkdir -p .keystore
          keytool -genkeypair \
            -storetype JKS \
            -keystore .keystore/gemini-mobile.jks \
            -storepass "$GEMINI_KEYSTORE_PASSWORD" \
            -keypass "$GEMINI_KEY_PASSWORD" \
            -alias "$GEMINI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Gemini CLI Mobile,O=GeminiMobile,C=US"

      - name: Build release APK
        run: gradle --stacktrace assembleRelease
        env:
          GEMINI_KEYSTORE_PATH: ${{ github.workspace }}/.keystore/gemini-mobile.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
